# Generated by scripts/build-skill.mjs from src/examples.json in the drawcast repository (github.com/hmelberg/drawcast). Do not edit by hand: rebuild with `npm run build:skill`.
# Request: If nobody sets the price, how does a market end up with one?
# Shows: template supply_demand, animated params, a portrait cameo
title: Economics 2 · The price nobody decides
template: supply_demand
params:
  x_label: Flats to rent
  y_label: Monthly rent
  demand: {}
  supply: {}
  equilibrium:
    show: true
    guides: true
    p_label: going rent
  price_floor:
    level: 70
    label: Asking too much
    show_surplus: true
  price_ceiling:
    level: 32
    label: Asking too little
    show_shortage: true
commands:
  - card:
      title: The price nobody decides
  - draw:
      - axes
    speak: If nobody sets the rent, how does a city end up with a going rate? No committee decides it. Flats along the bottom, monthly rent up the side.
  - draw:
      - demand_curve
      - label_D
    speak: 'Tenants first: the cheaper the flats, the more people want one of their own. Demand slopes down.'
  - draw:
      - supply_curve
      - label_S
    speak: 'Landlords: the higher the rent, the more flats get built, converted and let out. Supply slopes up.'
  - draw:
      - floor_line
      - label_floor
    speak: Suppose landlords start out asking too much.
  - draw:
      - surplus_guides
      - surplus_arrow
      - label_surplus
    speak: 'Read across: at that rent, more flats are offered than tenants will take. Some stand empty.'
  - animate:
      price_floor.level: 56
    duration: 3.5
    speak: An empty flat earns nothing, so its landlord asks a little less, then a little less again, and the empty flats fill.
  - erase:
      - floor_line
      - label_floor
      - surplus_guides
      - surplus_arrow
      - label_surplus
  - draw:
      - ceiling_line
      - label_ceiling
    speak: Now start too low instead.
  - draw:
      - shortage_guides
      - shortage_arrow
      - label_shortage
    speak: Many more tenants now want a flat than landlords offer. That gap is a queue.
  - animate:
      price_ceiling.level: 44
    duration: 3.5
    speak: People in the queue offer a bit more, landlords notice, and the rent creeps up as the queue shrinks.
  - erase:
      - ceiling_line
      - label_ceiling
      - shortage_guides
      - shortage_arrow
      - label_shortage
  - draw:
      - equilibrium_point
      - label_E
      - guide_lines
      - label_Pstar
      - label_Qstar
    speak: 'Both pressures stop at one rent: the crossing, where every flat offered finds a tenant and nobody queues.'
  - highlight:
      target:
        - equilibrium_point
    speak: No one had to know where the curves cross. Each landlord saw only an empty flat, each tenant only a queue, and that was enough.
  - draw:
      - portrait_friedrich_hayek
    speak: 'Friedrich Hayek called this a marvel in 1945: prices carry what millions of people know to others who never meet them.'
  - erase:
      - portrait_friedrich_hayek
  - quiz:
      question: Flats stand empty for months at the going rent. What next?
      choices:
        - Rents drift down
        - Rents rise
        - Nothing, until the city acts
      correct: 1
      right: 'Rents drift down: every empty month is a reason for a landlord to ask less, until the flats are let.'
elements:
  - id: portrait_friedrich_hayek
    type: portrait
    of: Friedrich Hayek
    cameo: true
