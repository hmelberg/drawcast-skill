# Request: Do you really need 10,000 steps a day?
# Shows: freehand chart with sources and cites
title: Do you need 10,000 steps?
domain:
  x: [0, 14]
  'y': [0, 110]
sources:
  - id: paluch
    title: 'Daily steps and all-cause mortality: a meta-analysis of 15 international cohorts'
    authors: Paluch et al.
    year: 2022
    doi: 10.1016/S2468-2667(21)00302-9
    finding: Risk falls, then levels off at 6,000–10,000 steps
  - id: lee
    title: Association of Step Volume and Intensity With All-Cause Mortality in Older Women
    authors: Lee et al.
    year: 2019
    doi: 10.1001/jamainternmed.2019.0899
    finding: 'Older women: benefit levels off near 7,500'
  - id: saint_maurice
    title: Association of Daily Step Count and Step Intensity With Mortality Among US Adults
    authors: Saint-Maurice et al.
    year: 2020
    doi: 10.1001/jama.2020.1382
    finding: '8,000 steps: half the risk of 4,000'
  - id: who2020
    title: World Health Organization 2020 guidelines on physical activity and sedentary behaviour
    authors: Bull et al.
    year: 2020
    doi: 10.1136/bjsports-2020-102955
    finding: Some activity beats none
more:
  label: Sources
  items:
    - paluch
    - lee
    - saint_maurice
    - who2020
    - title: 'WHO fact sheet: physical activity'
      url: https://www.who.int/news-room/fact-sheets/detail/physical-activity
      text: The guidelines in plain words
elements:
  - id: ax
    type: axes
    x_label: Steps a day (thousands)
    y_label: Risk of dying
  - id: risk
    type: curve
    expr: 45 + 55*exp(-0.45*(x - 3.5))
    x_from: 3.5
    x_to: 13.5
    style:
      color: '#2f6b8f'
  - id: q1
    type: point
    at:
      x: 3.55
      'y': 100
    style:
      color: '#2f6b8f'
    cites:
      - paluch
  - id: q2
    type: point
    at:
      x: 5.8
      'y': 60
    style:
      color: '#2f6b8f'
    cites:
      - paluch
  - id: q3
    type: point
    at:
      x: 7.84
      'y': 55
    style:
      color: '#2f6b8f'
    cites:
      - paluch
  - id: q4
    type: point
    at:
      x: 10.9
      'y': 47
    style:
      color: '#2f6b8f'
    cites:
      - paluch
  - id: dots
    type: group
    members:
      - q1
      - q2
      - q3
      - q4
  - id: goal_line
    type: arrow
    from:
      x: 10
      'y': 0
    to:
      x: 10
      'y': 95
    style:
      color: '#8f887c'
      dash: true
  - id: l_goal
    type: label
    attach_to: goal_line
    side: above
    text: 10,000 goal
    style:
      color: '#8f887c'
  - id: drop_note
    type: label
    attach_to: q2
    side: above-right
    text: big drop
    style:
      color: '#b5482e'
  - id: level_note
    type: label
    attach_to: q3
    side: above
    text: levels off
    style:
      color: '#b5482e'
    cites:
      - lee
      - paluch
commands:
  - card:
      title: Do you need 10,000 steps?
  - draw:
      - ax
    speak: Do you really need ten thousand steps a day? Let's look at what the studies found.
  - draw:
      - goal_line
      - l_goal
    speak: The ten thousand goal began as a pedometer slogan in Japan in the 1960s, not as a result from a study.
  - draw:
      - q1
    speak: In 2022, researchers pooled fifteen studies of about forty-seven thousand adults wearing step counters. Here is the risk of dying for the least active quarter.
  - draw:
      - q2
      - drop_note
    speak: People at around six thousand steps had about forty percent lower risk. That is the big drop.
  - draw:
      - q3
      - q4
    speak: Going on to eight thousand, then eleven thousand, bought a little more, but much less.
  - draw:
      - risk
      - level_note
    speak: 'The curve levels off: at six to eight thousand for people over sixty, and at eight to ten thousand for younger adults.'
  - highlight:
      target:
        - dots
    speak: These studies follow people over time, so they show an association, not proof that the steps did it. But studies of older women and of American adults found the same shape.
  - erase:
      - drop_note
  - speak: So ten thousand is fine, but it is not a threshold. The biggest gain comes from moving at all. The studies are in the corner, under Sources.
  - quiz:
      question: Where does the curve say an inactive person gains the most?
      choices:
        - The first few thousand extra steps
        - The last steps before 10,000
        - Only past 12,000
      correct: 1
      right: 'The first few thousand: the risk falls fastest from the least active group, then levels off.'
