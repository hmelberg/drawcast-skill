commands:
  - card:
      title: Thrown or dropped?
  - draw:
      - ground
      - ledge
    speak: Why does a ball thrown sideways hit the ground at the same time as one that is just dropped?
  - draw:
      - ledge_h
    speak: Take a ledge five metres up, and ignore the air.
  - draw:
      - ball_drop
      - ball_throw
      - v_arrow
      - v_label
      - clock
    speak: Drop one ball, and throw the other sideways at three metres per second.
  - highlight:
      target:
        - ball_throw
    speak: Most people expect the thrown ball to stay up longer — it has farther to go.
  - animate:
      t: 1
    duration: 2.5
    easing: linear
    trail:
      of: ball_throw
    speak: Let both go at once — and they hit the ground together.
  - pause: 0.5
  - draw:
      - strobe_drop
      - strobe_throw
    parallel: true
    speak: Now freeze the flight every fifth of a second.
  - draw:
      - levels
    speak: At every snapshot, the two balls are at exactly the same height.
  - draw:
      - fall_1
      - fall_2
      - fall_3
    speak: By then they have fallen 0.2 metres, 0.8, 1.8 — the same for both.
  - draw:
      - g_drop
      - g_lab_d
      - g_throw
      - g_lab_t
    parallel: true
    speak: Gravity pulls straight down, and pulls on both balls the same.
  - highlight:
      target:
        - strobe_drop
    speak: It adds downward speed every instant, so each gap is bigger than the last.
  - focus:
      target:
        - v_arrow
        - v_label
    speak: The sideways speed points across, so it can neither help nor hinder the fall.
  - draw:
      - steps
      - step_m
      - land_m
      - label_land_m
    speak: Sideways, the ball just steps along, 0.6 metres each snapshot — three metres in all.
  - draw:
      - calc_box
      - calc_line_1
    speak: So the landing time is set by height alone; with g about ten metres per second squared…
  - draw:
      - calc_line_2
      - box_t
    speak: …five metres takes one second, however fast you throw.
  - fade:
      target:
        - strobe_drop
        - strobe_throw
        - levels
        - g_drop
        - g_lab_d
        - g_throw
        - g_lab_t
        - steps
        - step_m
        - label_step_m
        - ball_throw_trail
      to: 0.25
    speak: What if we throw it twice as hard?
  - hide:
      - ball_drop
      - ball_throw
      - land_m
      - label_land_m
      - fall_1
      - fall_2
      - fall_3
  - animate:
      t: 0
      v: 6
    duration: 0.3
  - show:
      - ball_drop
      - ball_throw
      - land_m
  - animate:
      t: 1
    duration: 2.5
    easing: linear
    trail:
      of: ball_throw
    speak: The path stretches out to six metres, but it still lands after one second.
  - show:
      - label_land_m
  - highlight:
      target:
        - ball_throw
        - ball_drop
        - clock
    speak: Speed decides where it lands; height decides when.
  - quiz:
      question: From the same five-metre ledge, a ball is thrown sideways at 10 metres per second. When does it land?
      choices:
        - After 1 second
        - After 2 seconds
        - After half a second
        - Later than the dropped ball
      correct: 1
      wrong: 'Ask what sets the fall: the sideways speed only carries the ball across.'
      right: 'After one second: the five-metre drop sets the time, and the sideways speed only carries it farther, to ten metres.'
