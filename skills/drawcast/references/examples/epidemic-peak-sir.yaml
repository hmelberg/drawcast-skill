# Request: Why does an epidemic peak before everyone is infected?
# Shows: interactive template sir_compartments, an explore beat
title: Why the wave turns
template: sir_compartments
params:
  r0: 3
  days: 120
  cursor_day: 20
commands:
  - card:
      title: Why the wave turns
  - draw:
      - box_s
      - flow_0
      - box_i
      - flow_1
      - box_r
    speak: 'Why does an epidemic peak and turn down while a third of people have still not caught it? Start with the simplest model: susceptible, infectious, recovered.'
  - draw:
      - rate_0
      - rate_1
      - r0_value
    speak: 'Take a virus where one case, among people who can all catch it, infects three others: R nought is three.'
  - draw:
      - axes
      - curve_s
    speak: The blue line is the share of the town still susceptible, day by day.
  - draw:
      - curve_i
      - peak
    speak: 'The red line is the share infectious at once: it climbs, peaks on day 38 with three in ten ill, and falls.'
  - draw:
      - curve_r
    speak: 'Green: recovered, and immune.'
  - pause: 0.4
  - draw:
      - cursor
    speak: On day 20, 93 in a hundred are still susceptible, so a case's three contacts give about 2.8 new cases.
  - highlight:
      target:
        - cursor_rt
    speak: 'That number is R t, the effective reproduction number: above one, the wave grows.'
  - draw:
      - threshold
    speak: 'Now the line that decides it: one third, one over R nought.'
  - animate:
      cursor_day: 38.4
    duration: 3
    speak: Slide to the peak. Only a third are still susceptible, so three contacts give one new case.
  - highlight:
      target:
        - threshold
    speak: R t is one exactly where the blue line crosses the dashed one — the same day the red line turns.
  - animate:
      cursor_day: 60
    duration: 3
    speak: Beyond it each case is replaced by fewer than one, and the wave drains, though the virus is as contagious as ever.
  - animate:
      cursor_day: 120
    duration: 3
    speak: 'Cases still sick keep infecting on the way down, so the blue line overshoots: in the end only six percent escape.'
  - point:
      at:
        ref: threshold
      gesture: underline
    speak: 'That line also gives the herd-immunity threshold: start with two thirds immune, and the wave never begins.'
  - explore: {}
    speak: Drag the cursor across the days, or scrub R nought, and watch R t pass one at the peak.
  - quiz:
      question: A virus has R nought 4. About what share is still susceptible when its wave peaks?
      choices:
        - A quarter
        - A half
        - Nobody
      correct: 1
      right: 'A quarter: the wave turns when R nought times the susceptible share falls to one, and four times a quarter is one.'
