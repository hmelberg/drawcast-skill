# Generated by scripts/build-skill.mjs from src/examples.json in the drawcast repository (github.com/hmelberg/drawcast). Do not edit by hand: rebuild with `npm run build:skill`.
# Request: What do a, b and c do to a parabola?
# Shows: interactive template equation_plot, an explore beat
title: What a, b and c do to a parabola
template: equation_plot
params:
  equation: y = a*x^2 + b*x + c
  params:
    a:
      value: 1
      min: -3
      max: 3
      step: 0.5
    b:
      value: 0
      min: -5
      max: 5
      step: 1
    c:
      value: -2
      min: -5
      max: 5
      step: 1
  x_range: [-5, 5]
  y_range: [-6, 8]
  marks:
    - roots
    - extrema
    - y_intercept
commands:
  - card:
      title: a, b and c
  - draw:
      - axes
    speak: What do the three numbers in a parabola's equation actually do to its shape?
  - draw:
      - eq
      - curve_0
    speak: 'Start with y equals x squared, minus two: a U, opening upward.'
  - draw:
      - y_intercept
    speak: c is the easy one. It is where the curve crosses the vertical axis.
  - animate:
      params.c.value: 1
    duration: 2.5
    speak: Raise c from minus two to one, and the whole U slides straight up.
  - highlight:
      target:
        - eq_param_a
    speak: a sets how wide the U is, and which way it opens.
  - animate:
      params.a.value: 3
    duration: 2
    speak: At three, the arms squeeze together.
  - animate:
      params.a.value: -1
    duration: 2.5
    speak: Below zero, the U turns over into a hill.
  - animate:
      params.a.value: 1
    duration: 1.5
    speak: Back to one.
  - draw:
      - min_1
    speak: Now watch the lowest point, the vertex, while b changes.
  - animate:
      params.b.value: 3
    duration: 4
    trail:
      of: min_1
    speak: As b grows, the vertex runs left and down, along a curve of its own.
  - highlight:
      target:
        - min_1_trail
    speak: 'Its path is itself a parabola, opening downward: b moves the U, but never changes its shape.'
  - erase:
      - min_1_trail
  - animate:
      params.c.value: -2
    duration: 2
    speak: Pull c back down, and the curve crosses zero twice again.
  - draw:
      - root_1
      - root_2
    parallel: true
    speak: Those crossings are the roots, the x values that solve the equation.
  - explore: {}
    speak: 'Now try it yourself: drag a number in the equation, or grab the curve.'
  - speak: So c lifts the curve, a stretches or flips it, and b slides it along a hidden parabola.
  - quiz:
      question: Which numbers can change without changing the parabola's shape?
      choices:
        - Only a
        - b and c
        - Only b
      correct: 2
      right: 'b and c only move the curve: c lifts it, b slides its vertex. Only a changes its shape.'
      wrong: Think of which change squeezed or flipped the U.
