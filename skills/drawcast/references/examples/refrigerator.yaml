commands:
  - card:
      title: How a fridge keeps cold
  - draw:
      - cabinet
      - l_inside
      - milk
      - l_milk
    speak: 'How does a fridge stay cold in a warm kitchen? The surprise: it makes no cold at all — it carries heat out.'
  - draw:
      - kitchen
    speak: Inside it is 4 degrees, out here 20, and heat always creeps from warm to cold — so warmth leaks in through the walls all day.
  - draw:
      - evap
      - l_evap
    speak: So a pipe runs round the inside, carrying a coolant that boils at about minus 25 degrees.
  - draw:
      - heat_in
      - l_heat_in
    speak: Colder than the milk, it soaks up the milk's heat, and that heat makes it boil into gas.
  - highlight:
      target:
        - evap
    speak: Boiling swallows a lot of heat — the way drying sweat cools your skin. This is where the inside gets cold.
  - pause: 0.4
  - draw:
      - p1
      - compressor
      - l_comp
    speak: Now the heat is in the gas. A pump, the compressor, sucks that gas out of the cabinet…
  - highlight:
      target:
        - compressor
      effect: pulse
      color: '#8a5fa8'
    speak: …and squeezes it hard.
  - draw:
      - p2
      - condenser
      - l_cond
    speak: 'Squeezed gas heats up: to about 45 degrees, hotter than the kitchen.'
  - draw:
      - heat_out
      - l_heat_out
    speak: So in the coils on the back, heat flows out into the room, and the gas cools back into a liquid.
  - pause: 0.3
  - draw:
      - p3
      - valve
      - l_valve
      - p4
    speak: Last, the liquid squeezes through a narrow valve back into the cabinet. Its pressure drops, and at low pressure it boils at minus 25 again.
  - flow:
      along:
        - p4
        - evap
        - p1
        - p2
        - condenser
        - p3
    speak: 'Round and round it goes: pick heat up inside, carry it out, dump it behind.'
  - highlight:
      target:
        - low_side
    speak: 'The whole trick is pressure: low where the coolant must be colder than the food,'
    delivery: grave
  - highlight:
      target:
        - high_side
    speak: high where it must be hotter than the room.
    delivery: grave
  - highlight:
      target:
        - compressor
    speak: 'That squeeze is what the electricity pays for: pushing heat uphill, from cold to warm.'
  - point:
      at:
        ref: heat_out
      gesture: circle
    speak: 'And it is why the back of a fridge feels warm: that is the heat that was in your food.'
  - quiz:
      intro: A quick check.
      question: On a hot day you leave the fridge door open. What happens to the kitchen?
      choices:
        - It cools down
        - It gets warmer
      correct: 2
      right: 'It gets warmer: the fridge only moves heat from its inside to its back, both in the same room — and its motor adds heat of its own.'
      wrong: Think about where the heat taken from inside ends up.
