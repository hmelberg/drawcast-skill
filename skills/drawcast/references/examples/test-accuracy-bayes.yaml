# Generated by scripts/build-skill.mjs from src/examples.json in the drawcast repository (github.com/hmelberg/drawcast). Do not edit by hand: rebuild with `npm run build:skill`.
# Request: The test is 99% accurate and mine came back positive. Am I probably ill?
# Shows: freehand: a grid of people, a formula that morphs
title: What 99% accurate is worth
elements:
  - id: grid
    type: pieces
    of: grid
    x: 260
    'y': 390
    width: 400
    height: 400
    'n': 10
    rows: 10
    style:
      color: '#8f887c'
  - id: caption
    type: text
    text: 100 people like you
    x: 260
    'y': 622
    font_size: 24
    style:
      color: '#8f887c'
  - id: mark_sick
    type: annotation
    target:
      - grid_1
    kind: circle
    style:
      color: '#b5482e'
  - id: mark_fp
    type: annotation
    target:
      - grid_57
    kind: circle
    style:
      color: '#8a5fa8'
  - id: lazy
    type: text
    text: a test that always says “healthy”
    x: 740
    'y': 560
    font_size: 24
  - id: lazy_x
    type: annotation
    target:
      - lazy
    kind: strike
  - id: odds
    type: math
    tex: \frac{\text{ill}}{\text{well}} = \frac{1 \times 0.99}{{99 \times 0.01}} \approx 1
    x: 740
    'y': 380
    colors:
      '0.99': '#b5482e'
      '0.01': '#8a5fa8'
  - id: portrait_thomas_bayes
    type: portrait
    of: Thomas Bayes
    cameo: true
commands:
  - card:
      title: What 99% accurate is worth
  - draw:
      - grid
      - caption
    speak: Does a positive on a ninety-nine percent accurate test mean you are probably ill? First, what that one number hides. Here are a hundred people like you.
  - draw:
      - mark_sick
    speak: Say one person in a hundred has the disease. Just this one.
  - draw:
      - lazy
    speak: A test that tells everyone they are healthy is right about ninety-nine of these hundred. Ninety-nine percent accurate, and useless.
  - draw:
      - lazy_x
    speak: 'So accuracy alone says little. A test has two numbers: how often it catches the sick, and how often it wrongly flags the healthy.'
  - erase:
      - lazy
      - lazy_x
  - highlight:
      target:
        - grid_1
    speak: A good test catches ninety-nine percent of the sick, so this person tests positive.
  - draw:
      - mark_fp
    speak: 'It also flags one healthy person in a hundred. Among ninety-nine healthy people that is about one: this person, perfectly well.'
  - highlight:
      target:
        - grid_1
        - grid_57
    speak: Two positive results, and only one of them is ill. Your positive is a coin flip.
  - pause: 0.4
  - draw:
      - odds
    speak: 'Weigh the two ways to get a positive: one sick person, caught, against ninety-nine healthy people, times a one percent slip.'
  - highlight:
      target: odds
      part: '{99 \times 0.01}'
    speak: When the false-alarm rate is as large as the share who are ill, a positive is even odds, however good the test sounds.
  - focus:
      target:
        - grid_1
        - grid_57
    speak: Now retest just these two, with a second test whose mistakes are independent. In this new crowd, one in two is ill.
  - morph:
      target: odds
      tex: \frac{\text{ill}}{\text{well}} = \frac{1 \times 0.99}{{1 \times 0.01}} = 99
    speak: 'The healthy crowd has shrunk from ninety-nine to one. A second positive means ninety-nine to one: ninety-nine percent.'
  - highlight:
      target:
        - odds
    speak: The first positive didn't settle it. It picked out a smaller crowd, in which the same kind of test is finally convincing.
  - draw:
      - portrait_thomas_bayes
    speak: Thomas Bayes worked out this kind of updating; his essay was published in 1763, two years after his death, by his friend Richard Price.
  - erase:
      - portrait_thomas_bayes
  - quiz:
      question: 'Disease: 1 in 50. False alarms: 1 in 50. A positive means…'
      choices:
        - About 98% ill
        - About even odds
        - About 2% ill
      correct: 2
      right: 'About even odds: the share who are ill equals the false-alarm rate, so a positive is as likely a slip as a real case.'
